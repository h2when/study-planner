function dispDate(s){const [y,m,d]=s.split('-');return `${Number(m)}/${Number(d)}`}
function countAll(){const a=days.flatMap(d=>d.tasks),n=a.filter(t=>t.done).length;return {total:a.length,n}}
function render(){days.sort((a,b)=>a.date.localeCompare(b.date));if(!days.length){days=initial()}if(!days.some(d=>d.date===selected))selected=days[0].date;const d=current(),stats=countAll();$('allCount').textContent=stats.total;$('doneCount').textContent=stats.n;$('allPercent').textContent=stats.total?Math.round(stats.n/stats.total*100)+'%':'0%';$('dayList').innerHTML=days.map(x=>`<button title="${esc(x.goal||'계획 세우기')}" aria-pressed="${x.date===selected}" class="day-btn ${x.date===selected?'active':''}" data-date="${esc(x.date)}"><span class="day-weekday">${esc(x.weekday||'')}</span><span class="day-date">${dispDate(x.date)}</span><span class="day-title">${esc(x.goal||'계획 세우기')}</span><span class="dot ${x.tasks.length&&x.tasks.every(t=>t.done)?'done':''}"></span></button>`).join('');$('weekday').textContent=`${d.date} · ${d.weekday||''}요일`;$('dateTitle').textContent=dispDate(d.date)+' 일정';$('goalText').textContent=d.goal||'오늘의 목표를 입력해봐!';$('wakeInput').value=d.wake||'';$('sleepInput').value=d.sleep||'';$('dayNote').value=d.note||'';const done=d.tasks.filter(t=>t.done).length,total=d.tasks.length;$('taskSummary').textContent=`${done} / ${total}개 완료`;$('taskBar').style.width=(total?100*done/total:0)+'%';$('taskList').innerHTML=d.tasks.length?d.tasks.map(t=>`<div class="task"><input type="checkbox" data-taskcheck="${esc(t.id)}" ${t.done?'checked':''} aria-label="할 일 완료"><div class="task-body"><div class="task-name ${t.done?'checked':''}">${esc(t.title)}</div>${t.detail?`<div class="task-meta">${esc(t.detail)}</div>`:''}</div><div class="task-actions"><button class="iconbutton" data-taskedit="${esc(t.id)}" aria-label="할 일 수정">수정</button><button class="iconbutton" data-taskdelete="${esc(t.id)}" aria-label="할 일 삭제">삭제</button></div></div>`).join(''):'<div class="empty">아직 할 일이 없어. 첫 미션을 추가해봐!</div>';$('eventList').innerHTML=d.events.length?d.events.map(e=>`<div class="event" data-kind="${esc(e.kind||'study')}"><div class="event-time">${esc(e.start||'시간 미정')}${e.end?'–'+esc(e.end):''}</div><div class="event-color"></div><div><div class="event-name">${esc(e.title)}</div>${e.note?`<div class="event-note">${esc(e.note)}</div>`:''}</div><div class="event-actions"><button class="iconbutton" data-eventedit="${esc(e.id)}" aria-label="일정 수정">수정</button><button class="iconbutton" data-eventdelete="${esc(e.id)}" aria-label="일정 삭제">삭제</button></div></div>`).join(''):'<div class="empty">등록된 시간별 일정이 없어. 추가해봐!</div>'}
function uid(){return 'id_'+Date.now()+'_'+Math.random().toString(36).slice(2,9)}
function field(label,name,value='',type='text',extra=''){return `<div class="field-wrap ${extra}"><label for="f_${name}">${label}</label><input class="field" id="f_${name}" name="${name}" type="${type}" value="${esc(value)}" ${name==='title'||name==='date'?'required':''}></div>`}
function openModal(type,id){editing={type,id};const d=current();let title='',html='';if(type==='task'){const t=d.tasks.find(x=>x.id===id)||{};title=id?'할 일 수정':'새 할 일';html=field('할 일 이름','title',t.title||'')+field('세부 메모 (선택)','detail',t.detail||'')}
if(type==='event'){const e=d.events.find(x=>x.id===id)||{};title=id?'일정 수정':'새 일정';html=`<div class="formgrid">${field('시작 시간 (예: 09:00)','start',e.start||'')}${field('종료 시간 (선택)','end',e.end||'')}${field('일정 이름','title',e.title||'','text','full')}<div class="field-wrap full"><label for="f_kind">분류</label><select class="field" id="f_kind" name="kind">${[['study','공부/과제'],['class','수업'],['personal','개인 일정'],['travel','이동/여행'],['break','휴식/식사']].map(([v,l])=>`<option value="${v}" ${e.kind===v?'selected':''}>${l}</option>`).join('')}</select></div>${field('세부 메모 (선택)','note',e.note||'','text','full')}</div>`}
if(type==='day'){title='날짜 정보 수정';html=field('날짜','date',d.date,'date')+field('오늘의 핵심 목표','goal',d.goal||'')}
if(type==='newday'){title='새 날짜 추가';html=field('날짜','date','2026-11-17','date')+field('오늘의 핵심 목표','goal','')}
$('modalTitle').textContent=title;$('formFields').innerHTML=html;$('modalWrap').classList.remove('hidden');$('formFields').querySelector('input')?.focus()}
function closeModal(){$('modalWrap').classList.add('hidden');editing=null}
function dayName(date){return ['일','월','화','수','목','금','토'][new Date(date+'T12:00:00').getDay()]}
$('editForm').addEventListener('submit',e=>{e.preventDefault();if(!editing)return;const v=Object.fromEntries(new FormData(e.target).entries()),d=current();if(editing.type==='task'){if(!v.title.trim())return;const t=d.tasks.find(x=>x.id===editing.id);if(t){t.title=v.title.trim();t.detail=v.detail}else d.tasks.push({id:uid(),title:v.title.trim(),detail:v.detail,done:false})}else if(editing.type==='event'){if(!v.title.trim())return;const t=d.events.find(x=>x.id===editing.id);if(t)Object.assign(t,v);else d.events.push({id:uid(),...v})}else if(editing.type==='day'||editing.type==='newday'){if(!v.date)return;if(days.some(x=>x.date===v.date&&x!==d&&editing.type==='day')||days.some(x=>x.date===v.date&&editing.type==='newday')){alert('이미 등록된 날짜야!');return}if(editing.type==='day'){d.date=v.date;d.weekday=dayName(v.date);d.goal=v.goal;selected=v.date}else{days.push({date:v.date,weekday:dayName(v.date),goal:v.goal,wake:'',sleep:'',note:'',events:[],tasks:[]});selected=v.date}}save();closeModal();render();toast('저장했어 ✨')});
$('cancelModal').onclick=closeModal;$('modalWrap').addEventListener('click',e=>{if(e.target===$('modalWrap'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$('dayList').addEventListener('click',e=>{const t=e.target.closest('[data-date]');if(t){selected=t.dataset.date;render()}});$('addTaskBtn').onclick=()=>openModal('task');$('addEventBtn').onclick=()=>openModal('event');$('editDayBtn').onclick=()=>openModal('day');$('newDayBtn').onclick=()=>openModal('newday');
$('taskList').addEventListener('click',e=>{const t=e.target,ed=t.closest('[data-taskedit]'),del=t.closest('[data-taskdelete]');if(ed)openModal('task',ed.dataset.taskedit);if(del&&confirm('이 할 일을 삭제할까?')){current().tasks=current().tasks.filter(x=>x.id!==del.dataset.taskdelete);save();render()}});$('taskList').addEventListener('change',e=>{if(e.target.matches('[data-taskcheck]')){const t=current().tasks.find(x=>x.id===e.target.dataset.taskcheck);if(t){t.done=e.target.checked;save();render()}}});$('eventList').addEventListener('click',e=>{const ed=e.target.closest('[data-eventedit]'),del=e.target.closest('[data-eventdelete]');if(ed)openModal('event',ed.dataset.eventedit);if(del&&confirm('이 일정을 삭제할까?')){current().events=current().events.filter(x=>x.id!==del.dataset.eventdelete);save();render()}});
for(const [id,key] of [['wakeInput','wake'],['sleepInput','sleep'],['dayNote','note']]){$(id).addEventListener('input',e=>{current()[key]=e.target.value;save()})}
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({app:'my-a-plus-planner',version:1,exportedAt:new Date().toISOString(),days},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='study-planner-backup.json';a.click();URL.revokeObjectURL(url);toast('백업 파일을 저장했어')};$('importBtn').onclick=()=>$('filePicker').click();$('filePicker').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const obj=JSON.parse(await f.text()),arr=Array.isArray(obj)?obj:obj.days;if(!Array.isArray(arr)||!arr.every(x=>typeof x.date==='string'&&Array.isArray(x.events)&&Array.isArray(x.tasks)))throw Error('형식 오류');if(!confirm('현재 일정을 백업 파일의 일정으로 교체할까?'))return;days=arr;selected=days[0]?.date||'2026-11-07';save();render();toast('백업을 불러왔어')}catch(err){alert('파일을 불러올 수 없어. 플래너에서 저장한 JSON 파일인지 확인해줘.')}finally{e.target.value=''}};
$('resetBtn').onclick=()=>{if(confirm('모든 수정과 완료 표시를 지우고 처음 계획으로 돌아갈까? 이 작업은 되돌릴 수 없어.')){days=initial();selected='2026-11-07';save();render();toast('초기 계획으로 돌아왔어')}};
render();
</script>
</body>
</html>
